services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subflow
      POSTGRES_PASSWORD: subflow
      POSTGRES_DB: subflow
    ports:
      - "5432:5432"
    volumes:
      - subflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subflow -d subflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
